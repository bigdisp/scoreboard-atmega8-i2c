name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PC tests + AVR build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr
      - name: Host tests (display driver + I2C protocol, mocked hardware)
        run: make -C tests test
      - name: AVR build + size check
        run: make -C tests avr
